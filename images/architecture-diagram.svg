<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1000" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141926" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E121B" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="terracotta-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#CC6B49" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="24" fill="url(#bg-grad)" stroke="#1F293D" stroke-width="1.5" />

  <!-- Title Header -->
  <text x="500" y="55" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="-0.5">Anthra Studio Architecture & MCP Pipeline</text>
  <text x="500" y="80" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">Open-Source Full-Stack Ecosystem • Accelerated by NVIDIA NIM on H100</text>

  <!-- Module 1: AI Engine -->
  <g transform="translate(60, 120)">
    <rect width="250" height="280" rx="20" fill="url(#card-grad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#10B981" fill-opacity="0.15" />
    <circle cx="38" cy="38" r="6" fill="#10B981" />
    <text x="70" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">1. AI Compute Engine</text>
    <text x="70" y="54" fill="#6EE7B7" font-family="monospace" font-size="10">NVIDIA NIM &amp; CLAUDE</text>
    
    <g transform="translate(20, 80)">
      <rect width="210" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">⚡ NVIDIA Nemotron 70B</text>
    </g>
    <g transform="translate(20, 130)">
      <rect width="210" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">✦ Claude 3.5/3.7 Sonnet</text>
    </g>
    <g transform="translate(20, 180)">
      <rect width="210" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">◈ DeepSeek R1 (NIM)</text>
    </g>
    <g transform="translate(20, 230)">
      <rect width="210" height="32" rx="8" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" />
      <text x="105" y="20" fill="#10B981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">&lt; 2ms Time-to-First-Token</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M320 260 L370 260" stroke="#CC6B49" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="370,260 362,255 362,265" fill="#CC6B49" />

  <!-- Module 2: Autonomous Planner & Backend -->
  <g transform="translate(380, 120)">
    <rect width="250" height="280" rx="20" fill="url(#card-grad)" stroke="#CC6B49" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#CC6B49" fill-opacity="0.15" />
    <circle cx="38" cy="38" r="6" fill="#CC6B49" />
    <text x="70" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">2. Autonomous Core</text>
    <text x="70" y="54" fill="#FCA5A5" font-family="monospace" font-size="10">EXPRESS &amp; MCP GATEWAY</text>
    
    <g transform="translate(20, 80)">
      <rect width="210" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">🎯 Autonomous System Planner</text>
    </g>
    <g transform="translate(20, 130)">
      <rect width="210" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">🔌 MCP Protocol (JSON-RPC 2.0)</text>
    </g>
    <g transform="translate(20, 180)">
      <rect width="210" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">📊 Live Telemetry Stream (48k TPS)</text>
    </g>
    <g transform="translate(20, 230)">
      <rect width="210" height="32" rx="8" fill="#CC6B49" fill-opacity="0.1" stroke="#CC6B49" stroke-width="1" stroke-opacity="0.3" />
      <text x="105" y="20" fill="#CC6B49" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">REST &amp; MCP Standard v1.0</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M640 260 L690 260" stroke="#CC6B49" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="690,260 682,255 682,265" fill="#CC6B49" />

  <!-- Module 3: 12-Page Frontend Suite -->
  <g transform="translate(700, 120)">
    <rect width="240" height="280" rx="20" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#38BDF8" fill-opacity="0.15" />
    <circle cx="38" cy="38" r="6" fill="#38BDF8" />
    <text x="70" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">3. Multi-Page Suite</text>
    <text x="70" y="54" fill="#7DD3FC" font-family="monospace" font-size="10">VITE + REACT + HTML</text>
    
    <g transform="translate(20, 80)">
      <rect width="200" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">🏠 Standalone Pages (12)</text>
    </g>
    <g transform="translate(20, 130)">
      <rect width="200" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">🧩 UI Component Gallery</text>
    </g>
    <g transform="translate(20, 180)">
      <rect width="200" height="38" rx="8" fill="#000000" fill-opacity="0.5" stroke="#1F293D" stroke-width="1" />
      <text x="15" y="24" fill="#E2E8F0" font-family="monospace" font-size="11">☁️ 1-Click Cloud Deploy (Vercel)</text>
    </g>
    <g transform="translate(20, 230)">
      <rect width="200" height="32" rx="8" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
      <text x="100" y="20" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Claude Editorial Aesthetic</text>
    </g>
  </g>
</svg>
